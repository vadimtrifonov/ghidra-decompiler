[tools]
python = "3.15.0"
ruff = "0.17.0"
java = "27.0.1"
"github:NationalSecurityAgency/ghidra" = { version = "Ghidra_12.1.4_build", asset_pattern = "ghidra_*_PUBLIC_*.zip", strip_components = "1", bin_path = "." }

[env]
GHIDRA_INSTALL_DIR = { value = "{{ tools['github:NationalSecurityAgency/ghidra'].path }}", tools = true }
GHIDRA_HEADLESS_MAXMEM = "8G"

[tasks.decompiler]
description = "Run Ghidra Decompiler"
run = "python -B -m scripts"

[tasks.test]
description = "Run the tests; those that start Ghidra take a few minutes"
run = "python -B -m unittest discover -s tests -v"

[tasks.check]
description = "Check Python formatting and lint rules"
run = [
  "ruff format --check scripts tests",
  "ruff check scripts tests",
]
